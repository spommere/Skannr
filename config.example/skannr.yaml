skannr:
  # Web listener endpoints. Use 127.0.0.1 for local-only, 0.0.0.0 for all IPv4
  # interfaces, or [::] for all IPv6 interfaces. A specific Yggdrasil IPv6
  # address can be used here as well. IPv6 literals must use [IPv6]:port.
  listeners:
  - "127.0.0.1:5004"
  # Example:
  # listeners:
  #   - "0.0.0.0:5004"
  #   - "[::]:5006"
  log_level: INFO
# Collector-specific settings live in config/collectors/<collector>.yaml.
persistence:
  backend: filesystem
  filesystem:
    log_dir: runtime/logs
    retention_days: 30
runtime:
  # Internal runtime knobs. Modify only if you know why; very small values can
  # increase CPU use or drop browser events under load.
  event_log_maxlen: 100
  sse_queue_size: 200
  sse_heartbeat_sec: 15
  system_status_interval_sec: 5
  shutdown_timeout_sec: 10
findings:
  enabled: true
  max_items: 200
  bootstrap_events: 1000
  strong_wifi_rssi: -50
  strong_wifi_ap_rssi: -45
  strong_ble_rssi: -55
  rssi_change_db: 12
  return_after_sec: 300
  lost_after_sec: 300
  # BLE randomization can create thousands of manufacturer-only MAC rows.
  # Keep per-device live Findings only when the device has a useful name by
  # default; Subject History still retains the raw BLE subjects.
  ble_live_identity_required: true
  ble_live_service_identity: false
  # Wi-Fi Monitor can see thousands of randomized probe MACs. Keep those raw
  # observations in Wi-Fi Monitor/Subject History/Reports, but avoid filling
  # live Insights with per-random-client churn by default. Live monitor-mode
  # Insights should focus on actual disruption frames and configured sensitive
  # SSID probes unless these knobs are intentionally enabled.
  wifi_monitor_emit_client_new: false
  wifi_monitor_emit_client_returned: false
  wifi_monitor_emit_client_lost: false
  wifi_monitor_emit_blank_probe: false
  wifi_monitor_emit_randomized_mac: false
  wifi_monitor_emit_probe_burst: false
  wifi_monitor_emit_strong_client: false
  wifi_monitor_emit_ap_presence: false
  wifi_monitor_emit_strong_ap: false
  wifi_monitor_probe_burst_once: true
  sensitive_ssids: []
  burst_window_sec: 30
  burst_count: 5
  cooldown_sec: 120
  persistent_signal_sec: 60
  aprs_move_km: 0.3
  aprs_temp_change_f: 5
  aprs_rain_1h_high_in: 0.25
  aprs_wind_high_mph: 25
  aprs_gust_high_mph: 35
  pws_temp_change_f: 5
  pws_rain_1h_high_in: 0.25
  pws_wind_high_mph: 25
  pws_gust_high_mph: 35
  adsb_low_altitude_ft: 1500
  adsb_nearby_radius_km: 10
  adsb_emit_new_aircraft: true
  noaa_upgrade_severities:
  - Severe
  - Extreme
  usgs_warning_magnitude: 4.0
  usgs_warning_distance_km: 100
  swpc_warning_xray_class: X1.0
  swpc_warning_radio_blackout: R3
  swpc_warning_solar_radiation_storm: S3
  swpc_warning_geomagnetic_storm: G3
  swpc_warning_kp: 7
  lan_return_after_sec: 3600
alerts:
  # Alerts are the small set of live conditions that should be visible from any
  # tab and stay open until ACKed or until active_ttl_sec expires. Findings and
  # Reports remain the broader explanatory layers.
  enabled: true
  max_items: 50
  active_ttl_sec: 3600
  # Repeated sightings of the same unacknowledged alert are coalesced for this
  # long. ACKed active alerts stay ACKed unless their level escalates.
  dedupe_sec: 900
  # Keep ACK memory for poll-feed alert events, so retained NOAA/USGS/SWPC
  # feed entries do not require repeated ACKs after the active row expires.
  ack_memory_ttl_sec: 604800
  ack_memory_alert_types:
  - noaa_hazard
  - usgs_earthquake
  - swpc_space_weather
  pushover:
    enabled: false
    userkey: ""
    appkey: ""
  drone_wifi:
    enabled: true
    level: critical
    min_rssi: -80
    ssid_patterns:
    - RID-*
    - DJI*
    - Mavic*
    - Phantom*
    - Inspire*
    - Spark*
    - Mini*
    - Autel*
    - Parrot*
    vendor_patterns:
    - DJI
    - SZ DJI
    - Autel
    - Parrot
    - Yuneec
    oui_prefixes:
    - 60:60:1f
  aprs_weather:
    enabled: true
    level: warning
    critical_level: critical
    rain_1h_in: 1.0
    critical_rain_1h_in: 2.0
    wind_gust_mph: 40
    critical_wind_gust_mph: 60
  pws_weather:
    enabled: true
    level: warning
    critical_level: critical
    rain_1h_in: 1.0
    critical_rain_1h_in: 2.0
    wind_gust_mph: 40
    critical_wind_gust_mph: 60
  rayhunter_warning:
    enabled: true
    level: critical
  wifi_disruption:
    enabled: true
    level: critical
    window_sec: 60
    count: 5
    # Alert only when deauth/disassociation frames look attack-like. Normal APs
    # can send targeted cleanup deauths, so those remain visible in Wi-Fi
    # Monitor/Reports but do not alert unless they are unusually broad or fast.
    broadcast_count: 3
    distinct_receiver_count: 3
    single_receiver_count: 50
  wifi_open_sensitive:
    enabled: true
    level: critical
    ssid_patterns: []
  ble_tracker:
    enabled: true
    level: critical
    min_rssi: -85
    name_patterns:
    - '*airtag*'
    - '*find my*'
    - '*tile*'
    - '*chipolo*'
    - '*smarttag*'
    - '*tracker*'
    - '*pebblebee*'
    - '*orbit*'
    manufacturer_patterns: []
    service_uuid_patterns:
    - fd44
  collector_issue:
    # Generic collector setup/status problems are visible in System Status and
    # are not alerts by default. Turn this on only if collector availability
    # should page the operator.
    enabled: false
    level: warning
    ignored_reason_patterns:
    - '*No monitor-mode Wi-Fi interface found*'
  noaa_hazard:
    enabled: true
    level: warning
    critical_level: critical
    critical_events:
    - '*tsunami warning*'
    - '*tornado warning*'
    - '*hurricane warning*'
    - '*flash flood warning*'
    critical_severities:
    - Extreme
  usgs_earthquake:
    enabled: true
    level: warning
    critical_level: critical
    warning_magnitude_nearby: 4.0
    critical_magnitude_nearby: 5.0
    warning_magnitude_global: 6.5
    critical_magnitude_global: 7.5
    nearby_radius_km: 100
    critical_alert_colors:
    - orange
    - red
  swpc_space_weather:
    enabled: true
    level: warning
    critical_level: critical
    alert_min_xray_class: X1.0
    critical_min_xray_class: X5.0
    alert_min_radio_blackout: R3
    critical_min_radio_blackout: R4
    alert_min_solar_radiation_storm: S3
    critical_min_solar_radiation_storm: S4
    alert_min_geomagnetic_storm: G3
    critical_min_geomagnetic_storm: G4
    alert_min_kp: 7
    critical_min_kp: 8
  lan_gateway_change:
    enabled: true
    level: warning
  lan_new_device:
    # New LAN devices can be noisy on normal networks, so this is off by
    # default. The LAN tab, Subject History, and Reports still show them.
    enabled: false
    level: warning
  adsb_aircraft:
    enabled: true
    level: warning
    critical_level: critical
    nearby_radius_km: 10
    low_altitude_ft: 1500
  rtl433_signal:
    # RTL-433 decoded TPMS/security/remote/contact events can be useful but
    # noisy until the local RF environment is understood, so alerts are off by
    # default. Live feed, Subject History, Insights, and Reports still record
    # decoded events when the collector is enabled.
    enabled: false
    level: warning
    categories:
    - tpms
    - security
    model_patterns: []
    protocols: []
history_analysis:
  new_device_window_sec: 3600
  strong_wifi_rssi: -50
  strong_ble_rssi: -55
  many_bssid_count: 2
  wifi_same_ap_bssid_prefix_bytes: 5
  wifi_same_ap_max_last_byte_span: 16
  many_probe_ssid_count: 5
  blank_probe_count: 10
  deauth_count: 5
  randomized_mac_count: 10
  ble_linger_sec: 3600
  ble_lost_count: 3
  ble_recurring_min_sessions: 3
  ble_recurring_window_min: 30
  ble_ignore_stale_single_seen_sec: 3600
  ble_population_min_count: 10
  ble_population_min_strong_count: 3
  recent_activity_window_sec: 1800
  insights_recent_minutes: 60
  wifi_short_lived_sec: 900
  rtl433_recent_min_events: 1
  sensitive_ssids: []
reports:
  ble_long_presence_sec: 3600
  ble_recurring_min_days: 2
  ble_private_address_group_min_count: 3
  new_device_window_sec: 3600
  ble_strong_rssi: -55
  wifi_strong_rssi: -50
  wifi_signal_swing_db: 15
  wifi_many_bssid_count: 2
  wifi_recurring_min_days: 2
  wifi_long_presence_sec: 14400
  wifi_intermit_min_sessions: 3
  wifi_monitor_event_count: 5
  aprs_mobile_min_distance_km: 0.3
  aprs_weather_temp_change_f: 5
  aprs_weather_high_rain_1h_in: 0.25
  aprs_weather_high_wind_mph: 25
  aprs_weather_high_gust_mph: 35
  pws_weather_temp_change_f: 5
  pws_weather_high_rain_1h_in: 0.25
  pws_weather_high_wind_mph: 25
  pws_weather_high_gust_mph: 35
  noaa_high_severities:
  - Severe
  - Extreme
  usgs_nearby_radius_km: 100
  usgs_warning_magnitude: 4.0
  swpc_report_xray_class: X1.0
  swpc_report_radio_blackout: R3
  swpc_report_solar_radiation_storm: S3
  swpc_report_geomagnetic_storm: G3
  swpc_report_kp: 7
  adsb_low_altitude_ft: 1500
  adsb_nearby_radius_km: 10
  adsb_report_min_seen: 3
  rtl433_report_min_events: 2
  lan_report_new_devices: true
  lan_report_gateway_changes: true
ui:
  max_live_rows: 200
  max_history_rows: 500
  max_history_payload_rows: 1500
  max_event_log_items: 100
  max_rendered_findings: 1000
  max_history_ssids: 8
  bluetooth_live_recent_sec: 600
  # Live NOAA/USGS/SWPC feed rows older than this event/update age are hidden.
  # Raw logs, Subject History, Reports, and Alerts are not deleted by this.
  poll_feed_live_ttl_sec: 86400
  # Background cadence for compact Device History coalescing. Set 0 to disable.
  device_history_update_interval_sec: 60
  derived_stale_after_min: 15
  derived_auto_refresh_min: 15
  derived_refresh_timeout_sec: 600
  # Manual Refresh runs a real refresh by default whenever raw work is pending.
  # Set this to a positive byte threshold to allow recent small device-history
  # deltas to reuse cached derived views. Direct collector deltas always force
  # a real refresh so new ADS-B/RTL-433/APRS/etc. subjects are not hidden.
  # manual_refresh_small_delta_reuse_bytes: 0
  insights_recent_after_min: 30
