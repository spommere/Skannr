key: lan_identify
kind: action
order: 115
label: LAN Identify
description: On-demand active LAN service and HTTP clue collector
source_group: lan
source_group_label: LAN
acquisition_mode: scan
enabled: true
auto_start: false

# Overall action timeout for one selected LAN subject.
identify_timeout_sec: 30

# Optional nmap pass. nmap_ports is passed as the service/version probe port
# list. nmap_timeout_sec bounds the command.
nmap_timeout_sec: 20
nmap_ports: 22,23,53,80,443,554,1900,5000,5353,8008,8080,8443,9100

# Optional HTTP probes. curl_timeout_sec bounds each request and
# curl_output_max_bytes caps captured body/header text retained for hints.
curl_timeout_sec: 8
curl_output_max_bytes: 30000
http_probe_ports:
- 80
- 443
- 5000
- 8008
- 8080
- 8443

# Case-insensitive strings used to summarize likely device/service families from
# HTTP headers, titles, and small response bodies.
http_hint_patterns:
- myq
- chamberlain
- liftmaster
- ring
- reolink
- airplay
- homekit
- printer
- ipp
- sonos
- roku
- chromecast
- unifi
- ubiquiti
