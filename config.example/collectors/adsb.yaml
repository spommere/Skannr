key: adsb
order: 55
label: ADS-B
description: Optional dump1090/readsb decoded aircraft feed
acquisition_mode: listen
enabled: false

# By default Skannr starts dump1090/readsb on device_index, tells it where to
# write aircraft.json, reads that file, and rolls decoded aircraft state up into
# aircraft subjects, Insights, Alerts, and Reports. ADS-B can run alongside
# RTL-433 or rtl_power only when those collectors use different RTL-SDR indexes.
poll_interval_sec: 1
request_timeout_sec: 2
manage_decoder: true
device_index: 0
decoder_command: dump1090-mutability
decoder_args:
- --net
- --device-index
- "{device_index}"
- --write-json
- "{json_dir}"
decoder_output_dir: ""
decoder_start_timeout_sec: 10

# Leave url blank for managed decoder or local aircraft_json_paths mode. If url
# is set, Skannr does not start the decoder and reads this HTTP endpoint.
url: ""
aircraft_json_paths:
- /run/dump1090-fa/aircraft.json
- /var/run/dump1090-fa/aircraft.json
- /run/dump1090-mutability/aircraft.json
- /var/run/dump1090-mutability/aircraft.json
- /run/readsb/aircraft.json
- /var/run/readsb/aircraft.json

# If manage_decoder is true and decoder_output_dir is blank, Skannr writes the
# decoder JSON files under runtime/logs/adsb_decoder/. Skannr's own raw ADS-B
# event audit remains under runtime/logs/adsb/YYYY-MM-DD.jsonl.

# Optional observer coordinates. If omitted, Skannr falls back to NOAA/USGS
# collector latitude/longitude when available.
latitude:
longitude:

# Used for live warning Insights/Reports when distance is known.
nearby_radius_km: 10
low_altitude_ft: 1500
