key: adsb
order: 55
label: ADS-B
description: Optional dump1090/readsb decoded aircraft feed
acquisition_mode: listen
enabled: false

# ADS-B uses an RTL-SDR-compatible decoder such as dump1090 or readsb. ADS-B
# and RTL-433 cannot use the same RTL-SDR dongle at the same time, so use
# different device_index values when both collectors run on one host.

# Aircraft state polling. poll_interval_sec controls how often Skannr reads the
# decoder's aircraft.json. request_timeout_sec bounds HTTP/file read attempts.
poll_interval_sec: 1
request_timeout_sec: 2

# Decoder management. When manage_decoder is true, Skannr starts a local decoder,
# points it at device_index, and reads the generated aircraft.json output.
manage_decoder: true
device_index: 0

# Leave blank for automatic fallback: dump1090-mutability, dump1090-fa,
# dump1090, then readsb.
decoder_command: ""

# Arguments for managed decoder startup. {device_index} and {json_dir} are
# substituted by Skannr. These dump1090-style defaults are translated to readsb
# arguments when readsb is selected as the fallback decoder.
decoder_args:
- --net
- --device-index
- "{device_index}"
- --write-json
- "{json_dir}"

# Managed decoder output. Blank decoder_output_dir uses
# runtime/logs/adsb_decoder/. decoder_start_timeout_sec bounds startup wait.
decoder_output_dir: ""
decoder_start_timeout_sec: 10

# External decoder mode. If url is set, Skannr does not start a decoder and reads
# that aircraft.json endpoint instead. When url is blank, these local paths are
# tried before/alongside managed decoder output.
url: ""
aircraft_json_paths:
- /run/dump1090-fa/aircraft.json
- /var/run/dump1090-fa/aircraft.json
- /run/dump1090-mutability/aircraft.json
- /var/run/dump1090-mutability/aircraft.json
- /run/readsb/aircraft.json
- /var/run/readsb/aircraft.json

# Optional observer coordinates. If omitted, Skannr falls back to NOAA/USGS
# collector latitude/longitude when available.
latitude:
longitude:

# Used for live warning Insights, Alerts, and Reports when distance is known.
nearby_radius_km: 10
low_altitude_ft: 1500

# Aircraft filter. When any key is set, only aircraft matching at least one
# rule pass through. All keys empty = no filtering (all aircraft). Rules are
# OR'd — matching any single rule lets the aircraft through.
filter:
  # DO-260B emitter categories (case-insensitive).
  # A0: no category info    A4: high vortex (757-class)
  # A1: light <15500lbs     A5: heavy >300000lbs
  # A2: small 15500-75000   A6: high performance (>5g, >400kt) — fighters
  # A3: large 75000-300000  A7: rotorcraft
  # B0-B7: same weight classes, different emitter sub-types.
  # C0-C7: same weight classes, yet another sub-type space.
  # Military filtering: A6 catches fighters/attack aircraft.
  # Combine with callsign_prefixes or icao_prefixes for transports.
  categories: []

  # Squawk codes (4 octal digits, e.g. "7777" for military intercept).
  # Other notable codes: 7600 (radio failure), 7700 (emergency).
  squawks: []

  # 3-letter ICAO airline/operator prefixes from callsigns.
  # Military examples: RCH (Reach), DUKE (Duke), JEDI (Jedi), CNV (Convoy),
  #   RRR (Ascot), RFR (Rafair), GAF (German Air Force), FAF (French AF).
  callsign_prefixes: []

  # ICAO 24-bit hex address prefixes.
  # Military examples: AE (US military), 3F (Germany), 43 (UK), 4B (NATO).
  # Full list: refer to an ICAO address allocation table.
  icao_prefixes: []

  # Only show aircraft with an active emergency flag
  # (general, lifeguard, minfuel, nordo, unlawful, downed).
  emergency_only: false
