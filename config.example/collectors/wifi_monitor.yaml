key: wifi_monitor
order: 20
label: Wi-Fi Monitor
description: On-demand monitor-mode Wi-Fi packet capture and channel hopping
acquisition_mode: listen
enabled: true
auto_start: false
validation_timeout_sec: 10
# auto chooses the best monitor-mode interface. ALFA/external USB adapters are
# preferred when their metadata is visible through sysfs.
interface: auto
interfaces: []
interface_regex: wlan|^mon
# Leave false when monitor mode is managed by NetworkManager/systemd/manual host
# setup. Set true only with a specific interface such as wlan1 when Skannr should
# run nmcli/ip/iw setup before starting packet capture.
#
# prepare_monitor_mode does not convert interface: auto into a managed adapter.
# auto only discovers adapters that are already in monitor mode. For Skannr to
# prepare the adapter, set interface: wlan1 or interfaces: [wlan1].
prepare_monitor_mode: false
set_networkmanager_unmanaged: true
monitor_setup_timeout_sec: 10
bands:
- '2.4'
- '5'
# channel_mode:
# - hop: retune across the channel plan below
# - fixed: stay on fixed_channel only
channel_mode: hop
fixed_channel:
typical_channels_24:
- 1
- 6
- 11
typical_channels_5:
- 36
- 40
- 44
- 48
- 149
- 153
- 157
- 161
- 165
include_seen_channels: false
seen_channels_first: false
common_channel_fallback: true
dwell_sec: 1
retry_interval_sec: 5
retry_timeout_sec: 30
