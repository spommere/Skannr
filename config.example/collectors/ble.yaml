key: ble
order: 30
label: BLE Scan
description: Bluetooth Low Energy advertisement scanning
source_group: bluetooth
source_group_label: Bluetooth
acquisition_mode: scan
enabled: true
validation_timeout_sec: 10

# BLE has two scan methods:
#   1. BlueZ/Bleak, the default primary method.
#   2. bluetoothctl, normally used as a fallback after BlueZ/Bleak timeouts.
# To make bluetoothctl primary, set force_bluetoothctl_scan: true.
# To keep BlueZ/Bleak primary and bluetoothctl as fallback, keep
# force_bluetoothctl_scan: false and bluetoothctl_fallback_after_timeout: true.

# Adapter selection. Empty means Skannr ranks available BlueZ adapters and tends
# to choose external USB adapters before built-in radios.
adapters: []

# BlueZ/Bleak primary scan settings. scan_interval_sec is the steady-state delay
# between successful BLE scan passes. discover_timeout_sec is a hard timeout for
# a Bleak discovery/callback pass; 0 uses the scanner default. device_timeout_sec
# controls when live BLE rows age out after they stop being observed.
scan_interval_sec: 2
discover_timeout_sec: 0
device_timeout_sec: 60

# Active scanning asks devices for scan-response data when supported. Callback
# mode uses Bleak's advertisement callback path. Set force_discover_scan: true
# to force the simpler Bleak discover path even when callback_scan is true.
active_scan: true
callback_scan: true
force_discover_scan: false

# bluetoothctl method controls. force_bluetoothctl_scan makes bluetoothctl the
# primary scanner. bluetoothctl_fallback_after_timeout keeps BlueZ/Bleak primary
# but switches to bluetoothctl after repeated discovery timeouts.
bluetoothctl_fallback_after_timeout: true
force_bluetoothctl_scan: false

# BlueZ behavior tuning. DuplicateData keeps repeated advertisements flowing.
# reset_after_discovery_timeout asks Skannr to reset the adapter after discovery
# timeouts. The warmup settings run a short BlueZ warmup scan after repeated
# empty scans on hosts where BlueZ needs a nudge before advertisements appear.
bluez_duplicate_data: true
reset_after_discovery_timeout: true
bluez_warmup_after_empty_scans: 5
bluez_warmup_scan_sec: 4
bluez_warmup_min_interval_sec: 60

# Optional Bluetooth Classic name lookups for BLE addresses. These can add useful
# labels but are slower and can perturb weak adapters, so they are off by default.
name_lookup_interval_sec: 60
classic_name_lookup: false
classic_name_timeout_sec: 2

# BlueZ cache-stale detection. When BlueZ reports a cached device that is no
# longer advertising, its RSSI stays identical across every scan cycle. A real
# BLE signal always fluctuates, so N consecutive identical RSSI values means the
# device entry is stale. Set to 0 to disable detection.
cache_stale_rssi_threshold: 10

# Retry and wedged-adapter handling. retry_interval_sec is used after collector
# failures. retry_timeout_sec is reported as the setup/retry window. Repeated
# "operation already in progress" conditions can trigger reset/wedged warnings.
retry_interval_sec: 5
retry_timeout_sec: 30
reset_after_in_progress: 3
wedged_warning_after_in_progress: 6
