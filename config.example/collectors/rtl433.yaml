key: rtl433
order: 53
label: RTL-433
description: Optional rtl_433 decoded ISM-band device feed
acquisition_mode: listen
enabled: false
auto_start: false

# rtl_433 decodes many ISM-band devices: TPMS, weather sensors,
# garage/security/contact remotes, utility meters, thermometers, leak sensors,
# and similar low-power transmitters. ADS-B and RTL-433 cannot use the same
# RTL-SDR dongle at the same time. Configure different device_index values when
# this host has more than one dongle.
device_index: 0
command: rtl_433
gain: auto
sample_rate: 250k
ppm: 0
units: native

# Frequency plan syntax:
#   <freq_mhz>:<dwell_sec>
#   <start_mhz>-<end_mhz>:<step_khz>:<dwell_sec>
#
# Bare frequencies are MHz. For example, 144.39:0 means 144.39 MHz fixed.
# Explicit suffixes are accepted too: Hz, kHz, MHz, M, GHz, and G.
#
# Examples:
#   433.92:0              fixed frequency forever
#   315.22:12             listen 12 seconds
#   915-916:50:10         scan 915.000..916.000 MHz, 50 kHz steps, 10 sec each
#   315.22:12,915-916:50:10,433.92:10
#
# Hopping can miss short transmissions such as keyfobs, garage remotes, or TPMS
# bursts. Use a fixed frequency when investigating a specific target.
#
# Common frequencies worth trying:
#   315 MHz     North America keyfobs, TPMS, garage/security devices
#   345 MHz     North America security systems
#   390 MHz     Older North America garage/security remotes
#   433.92 MHz  Very common ISM sensors/remotes, weather, security, some TPMS
#   868 MHz     EU SRD/weather/utility sensors
#   915 MHz     North America ISM sensors and utility/water/power meters
frequency_plan: "433.92:30,315:30,390:30,915:30"

# Optional rtl_433 decoder selection. Empty protocols means rtl_433's default
# enabled decoder set. Values are rtl_433 -R protocol IDs and vary by rtl_433
# version; run `rtl_433 -R help` on the target host for the authoritative list.
# Example shape: protocols: [40, 60] passes -R 40 -R 60.
# disabled_protocols entries are passed as negative -R values; [40] becomes
# -R -40. Use this to suppress noisy decoders while keeping defaults otherwise.
protocols: []
disabled_protocols: []

# Extra raw rtl_433 CLI args for local experiments. Keep empty for normal use so
# Skannr's generated command remains predictable.
extra_args: []

# Failure retry behavior after rtl_433 exits or cannot be started.
retry_interval_sec: 5
retry_timeout_sec: 30
