key: gpsd
order: 57
label: GPSD Location
description: Optional live observer location from GPSD JSON reports
source_group: location
source_group_label: Location
acquisition_mode: listen
enabled: false

# GPSD runs on the same Linux host by default and manages the USB GNSS receiver.
# Keep GPSD bound to loopback unless there is a deliberate secured network setup.
host: 127.0.0.1
port: 2947

# Reconnect and fix freshness controls.
connect_timeout_sec: 5
read_timeout_sec: 15
retry_interval_sec: 5
status_interval_sec: 5
stale_after_sec: 10

# Privacy default: do not write observer GPS positions into Remote ID event and
# history logs. When enabled, each aircraft retains at most 24 observer points;
# raw JSONL files follow persistence.retention_days. Proximity alerts still work
# with this disabled.
store_observer_track: false
