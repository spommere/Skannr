key: ble_identify
kind: action
order: 40
label: BLE Identify
description: On-demand active BLE Device Information Service reader
source_group: bluetooth
source_group_label: Bluetooth
acquisition_mode: scan
enabled: true
auto_start: false
validation_timeout_sec: 10

# Adapter selection. Empty means Skannr ranks available BlueZ adapters and tends
# to choose external USB adapters before built-in radios.
adapters: []
# Optional: pin adapter by MAC address to survive hciN name swaps across reboots.
# Find the MAC with: hciconfig hci0 | grep 'BD Address'
# mac:

# Active identify attempts for one selected BLE subject. identify_timeout_sec is
# per attempt, identify_attempts controls retries, and identify_retry_delay_sec
# is the delay between attempts.
identify_timeout_sec: 10
identify_attempts: 3
identify_retry_delay_sec: 1.5
retry_interval_sec: 5
retry_timeout_sec: 30
