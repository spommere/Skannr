key: usgs
order: 90
label: USGS
description: Optional internet-fed USGS earthquake feed
acquisition_mode: poll
enabled: false

# USGS is internet-fed situational context, not a local sensor measurement.

# HTTP polling controls. poll_interval_sec is the normal GeoJSON refresh cadence,
# request_timeout_sec is the per-request timeout, and user_agent is sent with
# requests.
poll_interval_sec: 300
request_timeout_sec: 15
user_agent: "Skannr USGS collector"

# Local-radius earthquake query controls. latitude/longitude are the observer
# center, radius_km bounds the query, min_magnitude filters small events, and
# orderby controls USGS result ordering.
latitude: 37.7749
longitude: -122.4194
radius_km: 300
min_magnitude: 5.0
orderby: time

# Optional worldwide major-earthquake subfeed. When USGS is enabled, Skannr
# includes this low-volume global feed by default and merges events into the
# same live USGS tab by USGS event ID.
global_major:
  enabled: true
  min_magnitude: 6.5
  orderby: time
  # Optional lookback; omit for the USGS service default.
  # lookback_days: 7

# Event severity defaults. Reports and Alerts can add their own thresholds.
warning_magnitude_nearby: 4.0
warning_magnitude_regional: 5.0
warning_magnitude_global: 6.5
warning_nearby_radius_km: 100

# Optional override if you want a fully custom USGS URL:
# url: "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=37.7749&longitude=-122.4194&maxradiuskm=300&minmagnitude=5.0&orderby=time"
